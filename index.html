<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind the plan! – Unit 2 Station 1, part 2</title>
<style>
@font-face{font-family:"Num";font-weight:400;unicode-range:U+0030-0039;src:local("Avenir Next Medium"),local("AvenirNext-Medium"),local("Segoe UI"),local("SegoeUI"),local("Arial")}
@font-face{font-family:"Num";font-weight:700;unicode-range:U+0030-0039;src:local("Avenir Next Bold"),local("AvenirNext-Bold"),local("Segoe UI Bold"),local("SegoeUI-Bold"),local("Arial Bold"),local("Arial-BoldMT")}
:root{
  --bg:#EEF1F4; --card:#FFFFFF; --ink:#14213D; --muted:#5B6779; --line:#D3DAE2;
  --be:#0A6FC2; --gt:#DC2A1E; --vb:#0B7A3B; --not:#9B1B6E; --wh:#FFB000; --mark:#FFE45C;
  --ok:#0B7A3B; --bad:#C62828;
  --font:"Num","Gill Sans","Gill Sans Nova","Gill Sans MT",Calibri,"Trebuchet MS",sans-serif;
  --hand:"Marker Felt","Bradley Hand","Segoe Print","Comic Sans MS",cursive;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:var(--font);color:var(--ink)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--wh);outline-offset:2px}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
#deck{position:absolute;left:50%;top:50%;width:1600px;height:900px;background:var(--bg);overflow:hidden;transform:translate(-50%,-50%);transform-origin:center}

/* ---------- top bar: the lesson as a Tube line ---------- */
#bar{position:absolute;left:0;right:0;top:0;height:78px;background:#fff;border-bottom:2px solid var(--line);display:flex;align-items:stretch;z-index:5}
#line{display:flex;padding-left:40px}
.st{position:relative;width:138px;padding:15px 0 0;border:0;background:none;text-align:left;color:var(--muted);font-size:20px}
.st::before{content:"";position:absolute;left:12px;top:23px;width:138px;height:8px;border-radius:4px;background:var(--c);opacity:.22}
.st:last-child::before{display:none}
.st.past::before{opacity:1}
.st .dot{position:relative;z-index:1;display:block;width:24px;height:24px;border-radius:50%;background:#fff;border:6px solid var(--c)}
.st.past .dot{background:var(--c)}
.st.now .dot{background:var(--c);box-shadow:0 0 0 4px #fff,0 0 0 8px var(--c)}
.st .lbl{display:block;margin-top:7px;white-space:nowrap}
.st.now .lbl{color:var(--ink);font-weight:700}
#tools{margin-left:auto;display:flex;align-items:center;gap:10px;padding-right:18px}
#clock{border:0;background:none;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;min-width:96px;text-align:right;padding:0 6px}
#clock.paused{opacity:.4}
#cnt{font-size:20px;color:var(--muted);min-width:74px;text-align:right;font-variant-numeric:tabular-nums}
.nb{width:50px;height:50px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:26px;line-height:1;display:grid;place-items:center;color:var(--ink)}
.nb:hover{border-color:var(--ink)}
.nb.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.nb.txt{font-size:20px;font-weight:700}

/* ---------- slide basics ---------- */
#stage{position:absolute;left:0;right:0;top:78px;bottom:0}
.slide{position:absolute;inset:0;padding:30px 56px 34px;display:flex;flex-direction:column;gap:18px;font-size:28px;line-height:1.35;animation:sin .3s ease-out both}
@keyframes sin{from{opacity:0}to{opacity:1}}
h2{font-size:46px;line-height:1.1;font-weight:700}
h2 small{font-size:24px;font-weight:400;color:var(--muted);margin-left:14px;white-space:nowrap}
.lead{color:var(--muted)}
.de{color:var(--muted);font-size:.82em}
[data-s]{opacity:0;transform:translateY(14px);transition:opacity .4s,transform .4s;pointer-events:none}
[data-s].on{opacity:1;transform:none;pointer-events:auto}
.row{display:flex;gap:18px;align-items:center}
.mini{border:2px solid var(--line);background:#fff;border-radius:99px;padding:3px 16px;font-size:19px;color:var(--muted)}
.mini:hover{border-color:var(--ink);color:var(--ink)}
.big2{font-size:42px;line-height:1.3}
.concl{background:var(--ink);color:#fff;border-radius:18px;padding:16px 26px;font-size:32px;line-height:1.25}
.concl b{color:var(--mark)}

/* grammar colours: pills and coloured words */
.cap{display:inline-flex;align-items:center;height:var(--caph,64px);padding:0 .55em;border-radius:calc(var(--caph,64px)/2);font-weight:700;color:#fff;white-space:nowrap;font-size:var(--capf,34px);line-height:1}
.cap.s{background:var(--ink)}.cap.be{background:var(--be)}.cap.gt{background:var(--gt)}.cap.vb{background:var(--vb)}.cap.not{background:var(--not)}
.cap.wh{background:var(--wh);color:var(--ink)}
.cap.r{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 3px var(--line)}
.c-be{color:var(--be);font-weight:700}.c-gt{color:var(--gt);font-weight:700}.c-vb{color:var(--vb);font-weight:700}.c-not{color:var(--not);font-weight:700}.c-wh{color:#A66F00;font-weight:700}
.nw{white-space:nowrap}

/* ---------- cover ---------- */
.s-cover{justify-content:center;gap:26px}
.s-cover h1{font-size:98px;line-height:1.02;font-weight:700;max-width:1300px;letter-spacing:-.01em}
.s-cover .where{font-size:28px;color:var(--muted)}
.pline{width:100%;height:auto;display:block;overflow:visible}
.pline text{font-family:var(--font);font-size:27px;fill:var(--ink);text-anchor:middle}
.pline text.sm{font-size:21px;fill:var(--muted)}
.pl-base{stroke:var(--ink);stroke-opacity:.14;stroke-width:14;stroke-linecap:round}
.pl-dot{fill:#fff;stroke:var(--ink);stroke-width:9}
.cv-train{animation:ride 2.6s cubic-bezier(.5,0,.2,1) .4s both}
@keyframes ride{from{transform:translateX(0)}to{transform:translateX(340px)}}
.agenda{display:flex;gap:16px;align-items:stretch}
.agenda .ag{flex:1;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 20px;font-size:27px;line-height:1.25}
.agenda p{font-size:27px;align-self:center;font-weight:700;white-space:nowrap;margin-right:6px}

/* ---------- review 1: the story as a Tube map ---------- */
.s-story{gap:14px}
.map .m-base{fill:none;stroke:var(--ink);stroke-opacity:.14;stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
.map .m-cg{fill:none;stroke:#E07B1A;stroke-width:14;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:1000;transition:stroke-dashoffset 1.3s ease,opacity .6s}
.s-story.st3 .m-cg{stroke-dashoffset:0}
.s-story.st4 .m-cg{opacity:.28}
.map .m-ch{fill:none;stroke:var(--gt);stroke-width:14;stroke-linecap:round;stroke-dasharray:1100;stroke-dashoffset:1100;transition:stroke-dashoffset 2.1s cubic-bezier(.5,0,.2,1)}
.s-story.st6 .m-ch{stroke-dashoffset:0}
.map .m-x,.map .m-why,.map .m-ok,.map .m-wc{opacity:0;transition:opacity .5s}
.s-story.st2 .m-wc,.s-story.st4 .m-x,.s-story.st4 .m-why{opacity:1}
.s-story.st6 .m-ok{opacity:1;transition-delay:1.9s}
.map .m-x line{stroke:var(--bad);stroke-width:13;stroke-linecap:round}
.map text.m-why{fill:var(--bad);font-size:23px}
.map text.m-ok{fill:var(--ok);font-size:64px;font-weight:700}
.map .m-train{transition:transform 2.1s cubic-bezier(.5,0,.2,1)}
.s-story.st6 .m-train{transform:translateX(1070px)}
.map .m-river{fill:none;stroke:#A9CFEF;stroke-width:30;stroke-linecap:round}
.map text.m-rl{fill:#fff;font-size:20px;font-style:italic}
.map .m-tb{fill:var(--ink);opacity:.72}
.map .m-av circle{fill:var(--ink)}
.map .m-av text{fill:#fff;font-weight:700;font-size:26px}
.qs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;flex:1;min-height:0}
.q{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px 22px 16px 72px;position:relative}
.qn{position:absolute;left:16px;top:16px;width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700}
.qq{font-weight:700;font-size:32px;line-height:1.25}
.qa{font-size:29px;line-height:1.3;color:#2B3A55;margin-top:14px}

/* ---------- review 2: the going to-train ---------- */
.s-train{justify-content:center}
.s-train h2{margin-bottom:6px}
.tzone{position:relative;height:250px}
.rails{position:absolute;left:-56px;right:-56px;top:146px;height:26px;background:linear-gradient(var(--ink),var(--ink)) 0 0/100% 7px no-repeat,repeating-linear-gradient(90deg,#B9C3CF 0 16px,transparent 16px 48px) 0 7px/100% 19px no-repeat}
.train{position:relative;display:flex;gap:26px;align-items:flex-start;transition:transform 1.9s cubic-bezier(.15,.75,.25,1)}
.s-train:not(.st1) .train{transform:translateX(1750px)}
.car{position:relative;flex:none;min-width:130px;height:120px;padding:0 34px;border-radius:20px;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:700;white-space:nowrap;box-shadow:inset 0 12px 0 rgba(255,255,255,.16),inset 0 -14px 0 rgba(0,0,0,.14);transition:border-radius .4s}
.car:first-child{border-top-left-radius:62px}
.car+.car::before{content:"";position:absolute;left:-28px;top:78px;width:30px;height:10px;border-radius:5px;background:#8C97A8}
.car .ct{position:relative;top:-4px}
.car .wl{position:absolute;bottom:-24px;width:42px;height:42px;border-radius:50%;background:var(--ink);border:8px solid #C9D1DB}
.car .wl.a{left:20px}.car .wl.b{right:20px}
.car .lab{position:absolute;top:186px;left:50%;transform:translateX(-50%);font-size:23px;font-weight:400;color:var(--muted);text-align:center;line-height:1.2;white-space:nowrap;opacity:0;transition:opacity .5s}
.car .lab b{display:block;color:var(--ink);font-size:26px}
.s-train.st2 .car .lab{opacity:1}
.car.ghost{display:none}
.car.s{--c:var(--ink)}.car.be{--c:var(--be)}.car.not{--c:var(--not)}.car.gt{--c:var(--gt)}.car.vb{--c:var(--vb)}
.car.wh{--c:var(--wh);color:var(--ink)}
.car.r{--c:#fff;color:var(--ink);box-shadow:inset 0 0 0 3px var(--line),inset 0 -14px 0 rgba(20,33,61,.05)}
.tcap{font-size:38px;line-height:1.3;min-height:50px}
.forms{display:grid;grid-template-columns:.8fr 1.1fr 1.4fr;gap:16px}
.form{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 20px;font-size:31px;line-height:1.3}

/* ---------- practise: right or wrong ---------- */
.rules{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:27px}
.fing{display:inline-flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:99px;padding:5px 20px 5px 7px}
.fing i{font-style:normal;width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700}
.bigitem{flex:1;min-height:0;background:#fff;border:2px solid var(--line);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:20px 40px;position:relative;text-align:center}
.bigs{font-size:66px;line-height:1.25;font-weight:700}
.ino{position:absolute;left:26px;top:18px;font-size:26px;color:var(--muted)}
.stamp{font-size:50px;font-weight:700;border:7px solid currentColor;border-radius:18px;padding:2px 26px;transform:rotate(-5deg);opacity:0}
.stamp.show{opacity:1;animation:stamp .45s cubic-bezier(.2,1.5,.4,1) both}
.stamp.ok{color:var(--ok)}.stamp.no{color:var(--bad)}
@keyframes stamp{from{opacity:0;transform:rotate(-5deg) scale(2.2)}to{opacity:1;transform:rotate(-5deg) scale(1)}}
.fix{font-size:44px;min-height:60px;opacity:0;transition:opacity .4s .3s}
.fix.show{opacity:1}
.fix u{text-decoration:none;background:#D8F0E0;border-radius:8px;padding:0 .15em;color:var(--ok);font-weight:700}

/* timer */
.frow{display:flex;justify-content:space-between;align-items:center;gap:20px}
.tm{display:inline-flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--line);border-radius:99px;padding:6px 10px 6px 8px;position:relative;overflow:hidden;flex:none}
.tm-go{border:0;background:var(--ink);color:#fff;border-radius:99px;padding:8px 24px;font-size:24px;font-weight:700;min-width:118px}
.tm-t{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;min-width:108px;text-align:center}
.tm-rs{border:0;background:none;font-size:28px;color:var(--muted);padding:0 10px}
.tm-bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--line)}
.tm-bar i{display:block;height:100%;background:var(--ok);transform-origin:left;transition:transform .3s linear}
.tm.low .tm-t{color:var(--bad)}.tm.low .tm-bar i{background:var(--bad)}
.tm.done{animation:blink .5s 6}
@keyframes blink{50%{background:var(--mark)}}

/* ---------- writing ---------- */
.s-n2s,.s-check{justify-content:center}
.n2s{display:flex;flex-direction:column;gap:22px}
.n2 {display:grid;grid-template-columns:470px 70px minmax(0,1fr);align-items:center;gap:10px}
.note{font-family:var(--hand);background:#FFF6C9;border-radius:6px;padding:16px 24px;font-size:37px;line-height:1.2;box-shadow:3px 4px 0 rgba(20,33,61,.12);transform:rotate(-1deg)}
.n2 .arr{font-size:50px;color:var(--muted);text-align:center}
.n2 .res{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px 26px;font-size:40px;line-height:1.3}
.task{font-size:28px;line-height:1.3}
.wgrid{display:grid;grid-template-columns:470px 520px minmax(0,1fr);gap:20px;flex:1;min-height:0}
.pad{font-family:var(--hand);background:#FFF6C9;border-radius:8px;padding:16px 24px;font-size:25px;line-height:1.3;box-shadow:4px 5px 0 rgba(20,33,61,.12)}
.pad h4{margin:8px 0 2px;font-size:28px;text-decoration:underline}
.pad h4:first-child{margin-top:0}
.pad p{padding-left:18px}
.mail{background:#fff;border:2px solid var(--line);border-radius:16px;padding:18px 26px;font-size:27px;line-height:1.35;display:flex;flex-direction:column;gap:6px}
.mail .ln{border-bottom:2px solid var(--line);height:34px}
.mail .dots{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;min-height:60px}
.help{display:flex;flex-direction:column;gap:14px;min-height:0}
.hbox{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 20px;font-size:24px;line-height:1.35}
.hbox h4{margin:0 0 4px;font-size:25px}
.hbox.star{border-color:var(--wh);background:#FFF8E1}
.checks{display:flex;flex-direction:column;gap:12px}
.ck{display:flex;align-items:center;gap:20px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px 24px;font-size:36px;width:100%}
.ck .bx{width:48px;height:48px;border-radius:12px;border:4px solid var(--ink);display:grid;place-items:center;font-size:34px;font-weight:700;color:transparent;flex:none}
.ck.done{border-color:var(--ok)}
.ck.done .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.report{background:var(--ink);color:#fff;border-radius:18px;padding:14px 26px;font-size:30px}
.report b{color:var(--mark)}

/* ---------- Writing Lab ---------- */
.labs{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;flex:1;min-height:0;max-height:470px}
.lcard{position:relative;text-align:left;background:#fff;border:2px solid var(--line);border-top:14px solid var(--c);border-radius:22px;padding:20px 22px;display:flex;flex-direction:column;gap:10px;box-shadow:0 5px 0 var(--line);transition:transform .15s}
.lcard:hover{transform:translateY(-4px) rotate(-.6deg)}
.lcard .num{position:absolute;right:20px;top:6px;font-size:66px;font-weight:700;color:var(--c);opacity:.3;line-height:1}
.lcard .ico{font-size:54px;line-height:1.1}
.lcard b{font-size:34px;line-height:1.1}
.lcard p{font-size:24px;color:var(--muted);line-height:1.3}
.lcard .ex{font-size:23px;line-height:1.45;background:#F3F6F9;border-radius:12px;padding:10px 14px;margin-top:auto}
.lcard .ex .hand{font-size:22px;padding:0 8px}
.labhead{display:flex;align-items:center;gap:20px}
.lab-l{width:78px;height:78px;border-radius:22px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:50px;font-weight:700;flex:none;box-shadow:0 5px 0 rgba(20,33,61,.2)}
.lab-t{flex:1;min-width:0}
.eyebrow{display:block;font-size:19px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.labhead h2{font-size:44px}
.hint{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;background:#fff;border:2px solid var(--line);border-left:12px solid var(--c);border-radius:16px;padding:10px 20px;font-size:25px;--caph:44px;--capf:23px}
.hint-t{font-weight:700;margin-right:6px}
.hint-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hx{color:var(--muted)}
.hint .yn,.hint .sg{width:32px;height:32px;font-size:19px;margin:0 4px 0 0}
.hint .sg{margin-left:8px}
.items{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:16px 20px;flex:1;min-height:0}
.it{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr);grid-template-rows:auto 1fr;gap:8px 16px;align-content:start;text-align:left;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 22px 12px 16px;box-shadow:0 4px 0 var(--line);transition:border-color .3s,box-shadow .3s}
.it:hover{border-color:#9AA6B6}
.it-n{position:relative;width:46px;height:46px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:25px;transition:background .3s}
.it-q{font-size:28px;line-height:1.3;align-self:center}
.it-a{grid-column:2;display:flex;align-items:center;min-height:58px;border-bottom:3px dashed #B9C3CF;font-size:30px;line-height:1.28;transition:border-color .3s}
.it-sol{opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s}
.it.open{border-color:var(--ok);box-shadow:0 4px 0 #BFE3CC}
.it.open .it-n{background:var(--ok)}
.it.open .it-a{border-bottom-color:transparent}
.it.open .it-sol{opacity:1;transform:none}
.it.star{border-color:#F2C94C;background:#FFFCF0}
.it.star .it-n::before{content:"★";position:absolute;top:-14px;left:-12px;font-size:26px;color:#E09B00}
.it.star.open{border-color:var(--ok)}
.hand{font-family:var(--hand);background:#FFF6C9;border-radius:6px;padding:2px 12px;display:inline-block;transform:rotate(-.6deg);font-size:26px;line-height:1.3;box-shadow:2px 3px 0 rgba(20,33,61,.1)}
.yn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;color:#fff;font-weight:700;font-size:22px;margin-left:12px;vertical-align:middle}
.yn.y{background:var(--ok)}.yn.n{background:var(--bad)}
.sg{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;color:#fff;font-weight:700;font-size:28px;margin-right:12px;vertical-align:middle}
.sg-p{background:var(--vb)}.sg-m{background:var(--not)}.sg-q{background:var(--be)}

/* ---------- finish ---------- */
.fin{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:34px;align-items:center;flex:1;min-height:0}
.hw{display:flex;flex-direction:column;gap:16px}
.hw h2{font-size:60px}
.url{font-size:35px;font-weight:700;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 22px;align-self:flex-start}
.qr{background:#fff;border-radius:20px;padding:18px;border:2px solid var(--line)}
.qr svg{display:block;width:100%;height:auto}
.exit{background:var(--ink);color:#fff;border-radius:20px;padding:18px 28px;font-size:36px;line-height:1.25}
.exit b{color:var(--mark)}

/* ---------- overlays ---------- */
#notes{position:absolute;right:0;top:78px;bottom:0;width:480px;background:#14213D;color:#fff;z-index:8;padding:22px 26px;overflow:auto;font-size:21px;line-height:1.4;box-shadow:-20px 0 50px rgba(0,0,0,.35)}
#notes h4{margin:0 0 10px;font-size:20px;color:var(--mark);font-weight:700}
#notes p{margin:0 0 10px}
#notes ul{list-style:disc;padding-left:22px;margin:0 0 10px}
#notes li{margin:3px 0}
#notes b{color:var(--mark)}
#notes .txt{width:100%;border-radius:10px;border:0;padding:10px 14px;color:var(--ink);font-size:22px;margin:8px 0}
#notes .btn{border:0;border-radius:10px;background:var(--wh);color:var(--ink);font-weight:700;padding:10px 20px;font-size:21px}
#menu{position:absolute;inset:78px 0 0 0;background:rgba(238,241,244,.97);z-index:9;padding:26px 50px;overflow:auto;columns:3;column-gap:30px}
#menu .mg{break-inside:avoid;margin-bottom:16px}
#menu h4{margin:0 0 4px;font-size:22px;color:var(--c)}
#menu button{display:block;width:100%;text-align:left;border:0;background:none;font-size:23px;padding:4px 10px;border-radius:8px}
#menu button:hover,#menu button.cur{background:#fff}
#menu .keys{font-size:19px;color:var(--muted);line-height:1.5;margin-top:10px}
#blank{position:absolute;inset:0;background:#000;z-index:30}
.gatebox{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:660px;background:#fff;border-radius:22px;padding:34px 40px;border:2px solid var(--line);font-size:26px}
.gatebox h1{font-size:44px;margin-bottom:6px}
.gatebox .gr{display:flex;gap:12px;margin:18px 0 10px}
.gatebox input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:10px 16px;font-size:26px}
.gatebox button{border:0;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;padding:10px 26px;font-size:26px}
.gatebox p{color:var(--muted);font-size:22px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>

const app=document.getElementById('app'),KEY='gtf-pw';
const norm=s=>String(s).toLowerCase().replace(/\s+/g,'');
const b64d=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
const get=()=>{try{return localStorage.getItem(KEY)||''}catch(e){return ''}},set=v=>{try{localStorage.setItem(KEY,v)}catch(e){}};
async function unlock(pw){try{
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(pw)),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(LOCK.s),iterations:LOCK.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const code=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(LOCK.i)},k,b64d(LOCK.c)));
  app.innerHTML='';const s=document.createElement('script');s.textContent="'use strict';\n"+code;document.body.appendChild(s);return true}catch(e){return false}}
(async function(){
  const m=/^#pw=([^&]+)/.exec(location.hash);
  if(m){let v=m[1];try{v=decodeURIComponent(v)}catch(e){}try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}if(await unlock(v)){set(v);return}}
  const saved=get();if(saved&&await unlock(saved))return;
  app.innerHTML='<div style="position:fixed;inset:0;background:#EEF1F4"><form class="gatebox" id="gf" style="width:min(660px,92vw)"><h1>Mind the plan!</h1><p>Unit 2, Station 1, part 2. Enter the password from your teacher.</p><div class="gr"><input id="pw" type="password" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Password"><button>Open</button></div><p id="pwmsg">&nbsp;</p></form></div>';
  const i=document.getElementById('pw');
  document.getElementById('gf').onsubmit=async e=>{e.preventDefault();if(await unlock(i.value))set(i.value);else{document.getElementById('pwmsg').textContent=window.crypto&&crypto.subtle?'That is not the password. Try again.':'This browser cannot open the page. Please use Chrome, Edge, Firefox or Safari.';i.select()}};
  i.focus();
})();
